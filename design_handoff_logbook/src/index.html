<script>
  /* Tweakable defaults — host rewrites this block on change to persist. */
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "voice": "editorial",
    "cadence": "stack",
    "detail": "full"
  }/*EDITMODE-END*/;
  /* Apply dataset immediately so there's no FOUC before React mounts. */
  (function () {
    const r = document.documentElement;
    r.dataset.voice   = window.TWEAK_DEFAULTS.voice;
    r.dataset.cadence = window.TWEAK_DEFAULTS.cadence;
    r.dataset.detail  = window.TWEAK_DEFAULTS.detail;
  })();
</script>
